name: tests

on:
  push:
  pull_request:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install pyserial numpy
      - name: Run unit tests
        working-directory: host_software
        run: python -m unittest discover -s tests -t . -v